# DocuMind — Docker Compose (Development)
# Start: docker compose up --build

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: documind-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: documind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d documind"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - documind-network

  # ── FastAPI Backend ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: documind-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - documind-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Vite Frontend (Dev) ─────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: documind-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - documind-network


# ── Networks ────────────────────────────────────────────────────────
networks:
  documind-network:
    driver: bridge

# ── Volumes ─────────────────────────────────────────────────────────
volumes:
  postgres_data:
  uploads_data:
  frontend_node_modules:
